name: Refresh profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "27 10 * * *"
  push:
    branches: [master]
    paths:
      - "scripts/update-profile-stats.mjs"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Fetch public statistics
        run: node scripts/update-profile-stats.mjs
      - name: Commit refreshed cards
        run: |
          git add assets/profile/stats.svg assets/profile/languages.svg assets/profile/streak.svg assets/profile/activity.svg assets/profile/stats-sources.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public profile statistics"
          git push origin HEAD:master
